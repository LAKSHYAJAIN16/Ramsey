name: Ramsey checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ramsey-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      BROWSERBASE_API_KEY: ''
      BACKBOARD_API_KEY: ''
      ELEVENLABS_API_KEY: ''
      FIREBASE_PROJECT_ID: ''
      SESSION_SECRET: ci-only-not-a-production-secret
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run offline backend tests
        run: python -m pytest backend/tests -q --junitxml=test-results/backend.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-results-${{ matrix.os }}
          path: test-results/backend.xml
          if-no-files-found: ignore
          retention-days: 7

  repository:
    name: Unity project and browser syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate portable Unity project
        run: python scripts/check_unity_project.py
      - name: Check browser JavaScript syntax
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            node --input-type=module --check < "$file" || exit 1
          done < <(find frontend homepage -type f -name '*.js' -print0)
